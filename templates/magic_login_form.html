<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | SigStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <div class="max-w-md mx-auto mt-20 p-8 bg-white shadow rounded">
        <h2 class="text-2xl font-bold mb-4 text-center">Sign in to SigStream</h2>

        {% if error %}
        <div class="bg-red-100 text-red-700 px-4 py-3 rounded mb-4">
            <p>{{ error }}</p>
            {% if suggestion and signup_link %}
            <p class="mt-2 text-sm">
                {{ suggestion }}
                <a href="{{ signup_link }}" class="text-blue-600 hover:underline">Sign up here</a>.
            </p>
            {% endif %}
        </div>
        {% endif %}

        <!-- Magic Link Sign-In -->
        <form method="post" action="/magic-login-signin" class="space-y-4">
            <input type="email" name="email" placeholder="Enter your email"
                   class="w-full px-4 py-2 border rounded mb-2" required />
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">
                Send Magic Link
            </button>
        </form>

        <hr class="my-6 border-gray-300">

        <!-- Google OAuth Sign-In -->
        <div class="text-center">
            <a href="/auth/google"
               class="inline-flex items-center px-4 py-2 bg-white border rounded hover:bg-gray-100">
                <img src="/static/img/google-logo.svg" alt="Google" class="h-5 w-5 mr-2" />
                <span class="text-gray-700">Sign in with Google</span>
            </a>
        </div>
    </div>

</body>
</html>
