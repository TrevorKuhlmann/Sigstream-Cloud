<!-- templates/magic_login_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In | SigStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto mt-20 p-8 bg-white shadow rounded">
        <h2 class="text-2xl font-bold mb-4 text-center">Sign in to SigStream</h2>

        {% if error %}
        <div class="bg-red-100 text-red-700 px-4 py-3 rounded mb-4">
            <p>{{ error }}</p>
            {% if suggestion and signup_link %}
            <p class="mt-2 text-sm">
                {{ suggestion }} <a href="{{ signup_link }}" class="text-blue-600 hover:underline">Sign up here</a>.
            </p>
            {% endif %}
        </div>
        {% endif %}

        <form method="post" action="/magic-login-signin">
            <input type="email" name="email" placeholder="Enter your email"
                   class="w-full px-4 py-2 border rounded mb-4" required />
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">
                Send Magic Link
            </button>
        </form>
    </div>
</body>
</html>
