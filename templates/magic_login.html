<!DOCTYPE html>
<html>
<head>
  <title>Magic Login</title>
</head>
<body>
  <h1>Magic Link Login</h1>
  {% if error %}<p style="color: red">{{ error }}</p>{% endif %}
  <form action="/magic-login-register" method="post">
  <input type="email" name="email" required placeholder="Your email" class="input" />
  <button type="submit" class="btn">Sign up with Email</button>
</form>

<form action="/magic-login-signin" method="post" class="mt-4">
  <input type="email" name="email" required placeholder="Your email" class="input" />
  <button type="submit" class="btn">Sign in with Email</button>
</form>

</body>
</html>
