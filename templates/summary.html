
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SigStream Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
  <div class="container mt-5">
    <h2>Recent Device Telemetry</h2>

<!-- Filter form -->
<form method="get" class="mb-3 d-flex">
  <input name="device_id" class="form-control me-2" placeholder="Filter by Device ID" value="{{ filter_id or '' }}">
  <button class="btn btn-primary">Filter</button>
</form>

<!-- Export CSV -->
<a href="/export{% if filter_id %}?device_id={{ filter_id }}{% endif %}" class="btn btn-success mb-3">
  Export CSV
</a>

    <form method="get" class="mb-3 d-flex">
      <input name="device_id" class="form-control me-2" placeholder="Filter by Device ID" value="{{ filter_id or '' }}">
      <button class="btn btn-primary">Filter</button>
    </form>
    <table class="table table-dark table-striped mt-4">
      <thead>
        <tr>
          <th>ID</th>
          <th>Device ID</th>
          <th>Data</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for row in records %}
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.device_id }}</td>
          <td>{{ row.data }}</td>
          <td>{{ row.timestamp | format_ts }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    {% if records|length == 0 %}
      <div class="alert alert-warning">No telemetry data available yet.</div>
    {% endif %}
  </div>
</body>
</html>
