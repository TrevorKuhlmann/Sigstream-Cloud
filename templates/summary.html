
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SigStream Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
  <div class="container mt-5">
    <h2>Recent Device Telemetry</h2>

    <table class="table table-dark table-striped mt-4">
      <thead>
        <tr>
          <th>ID</th>
          <th>Device ID</th>
          <th>Data</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for row in records %}
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.device_id }}</td>
          <td>{{ row.data }}</td>
          <td>{{ row.timestamp | format_ts }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    {% if records|length == 0 %}
      <div class="alert alert-warning">No telemetry data available yet.</div>
    {% endif %}
  </div>
</body>
</html>
