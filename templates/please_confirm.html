<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Please Confirm Your Email | SigStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-md mx-auto mt-20 bg-white shadow-md p-8 rounded text-center">
        <h1 class="text-2xl font-bold mb-4">Almost There…</h1>
        <p class="mb-6">
            We’ve just sent a confirmation link to<br />
            <strong>{{ email }}</strong>
        </p>
        <p class="text-sm text-gray-600 mb-6">
            Please check your inbox (and spam folder) and click the link to complete your sign-up.
        </p>
        <div class="loader mx-auto mb-6 border-4 border-gray-200 border-t-blue-600 rounded-full w-12 h-12 animate-spin"></div>
        <p class="text-xs text-gray-500">
            Didn’t receive the email? It can take a minute. If still nothing, try again or contact support.
        </p>
    </div>
</body>
</html>
