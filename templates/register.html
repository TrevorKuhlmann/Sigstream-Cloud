<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - SigStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-md mx-auto mt-20 bg-white shadow-md p-8 rounded">
        <h1 class="text-2xl font-bold mb-6 text-center">Create Your Account</h1>

        <!-- Success / Error Messages -->
        {% if message %}
        <div class="mb-4 p-3 rounded bg-green-100 text-green-700 text-sm">
            {{ message }}
        </div>
        {% endif %}
        {% if error %}
        <div class="mb-4 p-3 rounded bg-red-100 text-red-700 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Magic Link Sign-Up -->
        <form action="/magic-login-register" method="post" class="mb-6">
            <label for="email" class="block text-sm font-medium mb-1">Sign up with Email</label>
            <input type="email" name="email" required
                   class="w-full px-3 py-2 border rounded mb-2"
                   placeholder="you@example.com">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">
                Send Magic Link
            </button>
        </form>

        <hr class="my-6">

        <!-- Google OAuth Sign-Up -->
        <a href="/auth/google"
           class="flex items-center justify-center w-full mb-2 px-4 py-2 border rounded hover:bg-gray-100">
            <img src="/static/img/google-logo.svg" alt="Google" class="h-5 w-5 mr-2" />
            <span class="text-gray-700">Sign up with Google</span>
        </a>

        <!-- Placeholder for traditional (if you add later) -->
        <button disabled
                class="w-full bg-gray-200 text-gray-500 py-2 rounded cursor-not-allowed">
            Sign up with Email &amp; Password (coming soon)
        </button>

        <p class="text-xs text-center text-gray-500 mt-4">
            Already have an account?
            <a href="/login-form" class="text-blue-600 hover:underline">Login here</a>
        </p>
    </div>

</body>
</html>
