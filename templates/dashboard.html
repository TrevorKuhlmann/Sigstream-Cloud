<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="5">
<meta charset="UTF-8">
  <title>SigStream Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
  <div class="container mt-5">
    <h2>SigStream Device Dashboard</h2>
    <form method="get" class="mb-3 d-flex">
        <input name="device_id" class="form-control me-2" placeholder="Filter by Device ID" value="{{ filter_id or '' }}">
        <button class="btn btn-primary">Filter</button>
      </form>
      <table class="table table-dark table-striped mt-4">
      <thead>
        <tr>
          <th>ID</th>
          <td>
            {{ row.device_id }}
            {% if (loop.index0 == 0 or row.timestamp > (records[0].timestamp - 60)) %}
              <span class="badge bg-success">● online</span>
            {% else %}
              <span class="badge bg-secondary">● idle</span>
            {% endif %}
          </td>
          <th>Data</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for row in records %}
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.device_id }}</td>
          <td>{{ row.data }}</td>
          <td>{{ row.timestamp }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
